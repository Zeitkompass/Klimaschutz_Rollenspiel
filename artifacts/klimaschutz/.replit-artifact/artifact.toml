kind = "web"
previewPath = "/"
title = "Klimaschutz – Das Rollenspiel"
description = "Ein einfaches Live-Rollenspiel für Klasse 8: Staat, Unternehmen und Bürger entscheiden in vier Runden über Klimaschutz. Mit Lehrer-Master, Raumcode, Gruppen und fairem Rollenwechsel."
version = "1.0.0"
id = "artifacts/klimaschutz"
router = "path"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 20985

[services.development]
run = "pnpm --filter @workspace/klimaschutz run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/klimaschutz", "run", "build" ]
serve = "static"
publicDir = "artifacts/klimaschutz/dist/public"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "20985"
BASE_PATH = "/"
